# App Spec da Digital Ocean App Platform para o FRONTEND admin (site estatico).
# Nao tem banco nem variaveis de runtime - VITE_API_URL e injetada no BUILD (o Vite
# grava o valor direto no bundle), entao precisa ser preenchida com a URL publica do
# app da API (.do/app.api.yaml) ANTES de rodar o build.
#
# Como usar:
#   doctl apps create --spec .do/app.web.yaml
#   (ou pelo painel: Apps > Create App > este repositorio > aponte para este arquivo)

name: sistema-reservas-web
region: nyc

static_sites:
  - name: web
    github:
      repo: Igorbriano2/Sistema-Reservas-
      branch: claude/restaurant-booking-ai-agent-tjfvag
      deploy_on_push: true
    source_dir: web
    build_command: npm ci && npm run build
    output_dir: dist
    # Sem isso, abrir uma URL de rota do React direto (ex: o link /reservar/:token
    # que o agente manda no Instagram, ou /admin/dashboard) da 404 no host estatico -
    # ele so serve arquivos que existem de verdade em dist/. Com o catchall, qualquer
    # caminho sem arquivo correspondente cai no index.html e o React Router assume.
    catchall_document: index.html
    routes:
      - path: /
    envs:
      # URL publica do app da API, ex: https://sistema-reservas-api-xxxxx.ondigitalocean.app
      - key: VITE_API_URL
        scope: BUILD_TIME
        type: SECRET
