# App Spec da Digital Ocean App Platform para o BACKEND (API + webhook do Instagram).
# So roda o codigo aqui - o banco de dados e o Supabase, NUNCA o Managed Database da
# propria Digital Ocean (DATABASE_URL abaixo deve sempre apontar para o Supabase).
#
# ATENCAO: use a connection string do "Session pooler" do Supabase (Project Settings >
# Database > Connection string), NAO a conexao direta (db.<projeto>.supabase.co) - essa
# so tem endereco IPv6, e a App Platform (como a maioria das PaaS) so tem saida IPv4,
# entao a conexao direta falha aqui. O host do pooler e IPv4-compativel (formato
# aws-0-<regiao>.pooler.supabase.com:5432, usuario "postgres.<ref-do-projeto>").
#
# Como usar:
#   1. No painel da Digital Ocean: Apps > Create App > escolha este repositorio Github
#      e aponte para este arquivo (.do/app.api.yaml), ou rode:
#        doctl apps create --spec .do/app.api.yaml
#   2. As variaveis abaixo com "type: SECRET" e sem "value" ficam em branco no spec
#      de proposito (nunca vao pro Git) - a Digital Ocean pede o valor de cada uma
#      na tela de criacao do app, ou preencha depois em Settings > App-Level Env Vars.
#   3. O job pre_deploy roda "npm run db:migrate" automaticamente a cada deploy,
#      antes do novo release receber trafego - garante que a migration roda uma
#      unica vez mesmo com varias instancias do servico.
#   4. Depois do primeiro deploy, rode localmente (uma vez, fora do App Platform):
#        SEED_ADMIN_EMAIL=... SEED_ADMIN_PASSWORD=... \
#        SEED_PLATAFORMA_EMAIL=... SEED_PLATAFORMA_PASSWORD=... \
#        DATABASE_URL=<supabase> npm --prefix server run db:seed
#      (as duas variaveis SEED_PLATAFORMA_* sao opcionais - so criam o primeiro
#      login do painel da plataforma, em /painel, se preenchidas)
#      e, para conectar o Instagram:
#        INSTAGRAM_BUSINESS_ACCOUNT_ID=... INSTAGRAM_ACCESS_TOKEN=... \
#        TOKEN_ENCRYPTION_KEY=... DATABASE_URL=<supabase> \
#          npm --prefix server run instagram:connect -- --empresa-id <uuid>
#   5. Depois que a API estiver no ar, registre o webhook da Stripe (Developers >
#      Webhooks > Add endpoint) apontando pra <URL da API>/public/checkout/webhook,
#      selecionando os eventos invoice.payment_succeeded, invoice.payment_failed,
#      customer.subscription.updated e customer.subscription.deleted. Copie o
#      "Signing secret" (whsec_...) gerado e preencha STRIPE_WEBHOOK_SECRET abaixo.

name: sistema-reservas-api
region: nyc

jobs:
  - name: migrate
    kind: PRE_DEPLOY
    github:
      repo: Igorbriano2/Sistema-Reservas-
      branch: claude/restaurant-booking-ai-agent-tjfvag
      deploy_on_push: true
    source_dir: server
    build_command: npm ci && npm run build
    run_command: npm run db:migrate
    environment_slug: node-js
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    envs:
      - key: DATABASE_URL
        type: SECRET
      - key: DATABASE_SSL
        value: "true"

services:
  - name: api
    github:
      repo: Igorbriano2/Sistema-Reservas-
      branch: claude/restaurant-booking-ai-agent-tjfvag
      deploy_on_push: true
    source_dir: server
    build_command: npm ci && npm run build
    run_command: npm start
    environment_slug: node-js
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    http_port: 3000
    health_check:
      http_path: /health
    routes:
      - path: /
    envs:
      - key: NODE_ENV
        value: production
      # Supabase (Postgres) - NUNCA o Managed Database da Digital Ocean.
      - key: DATABASE_URL
        type: SECRET
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        type: SECRET
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: ANTHROPIC_API_KEY
        type: SECRET
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      # Fallback do agente (doc 39) - opcional. So preencher OPENAI_API_KEY quando
      # quiser ativar o fallback pra OpenAI (usado so quando a chamada primaria a
      # Claude API falha de verdade - credito/billing, rate limit, indisponibilidade).
      - key: OPENAI_API_KEY
        type: SECRET
      - key: OPENAI_MODEL
        value: gpt-4o
      # Qual das duas e a PRIMARIA agora ("anthropic" ou "openai") - a outra vira o
      # fallback automatico. Troca reversivel sem precisar de deploy novo: so editar
      # este valor no painel da DigitalOcean (ou aqui, se reaplicar o app spec).
      - key: AGENT_PROVIDER_PRINCIPAL
        value: anthropic
      - key: INSTAGRAM_APP_SECRET
        type: SECRET
      - key: INSTAGRAM_WEBHOOK_VERIFY_TOKEN
        type: SECRET
      - key: TOKEN_ENCRYPTION_KEY
        type: SECRET
      # URL publica do app estatico do frontend (ver .do/app.web.yaml), usada para
      # restringir o CORS em producao. Ex: https://sistema-reservas-web-xxxxx.ondigitalocean.app
      # Preencha depois de criar o app web (nao existe ainda no primeiro deploy da API).
      - key: CORS_ORIGIN
        type: GENERAL
        value: ""
      # Mesma URL do CORS_ORIGIN acima - usada para montar o link publico de reserva
      # que o agente manda ao cliente ("<WEB_APP_URL>/reservar/<token>").
      - key: WEB_APP_URL
        type: GENERAL
        value: ""
      - key: RESERVATION_LINK_SECRET
        type: SECRET
      - key: AGENT_DEBOUNCE_MS
        value: "6000"
      # Segredo do login do painel da plataforma (/painel) - separado do JWT_SECRET
      # de proposito (ver PLATAFORMA_JWT_SECRET em env.ts). Gere com: openssl rand -hex 32
      - key: PLATAFORMA_JWT_SECRET
        type: SECRET
      # Stripe (checkout/assinatura em /assinar) - chave secreta, nunca sai do backend.
      - key: STRIPE_SECRET_KEY
        type: SECRET
      - key: STRIPE_PRODUCT_ID
        type: SECRET
      # Opcional (auto-resolvido/criado se vazio - ver lib/stripe.ts).
      - key: STRIPE_PRICE_ID
        type: GENERAL
        value: ""
      # Preencher so depois de registrar o webhook no dashboard da Stripe.
      - key: STRIPE_WEBHOOK_SECRET
        type: GENERAL
        value: ""
