<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover (doc redesign, etapa PWA/mobile) - necessario pra env(safe-area-inset-*)
         funcionar no CSS (index.css); sem isso, "apple-mobile-web-app-status-bar-style:
         black-translucent" abaixo deixa o conteudo ir por baixo da status bar/home
         indicator do iPhone sem nenhum jeito de compensar via CSS. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Quero Reservar - agente de IA que atende e organiza reservas do seu restaurante direto no Instagram Direct." />
    <meta name="theme-color" content="#0d0d0d" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Quero Reservar" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Quero Reservar - Painel Administrativo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
